
[project]
name = "baalexp"
version = "0.8.0"
description = "FAIR-AL experiments for demographic query drift in ASD screening"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "FAIR-AL authors" }]
dependencies = [
  "numpy>=2.5.4,<2.6",
  "pandas>=3.1,<3.2",
  "scikit-learn>=1.9.1,<2.0",
  "scipy>=1.18,<1.19",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]

[project.scripts]
# FAIR-AL public command names.
fairal-run = "baalexp.run_experiment:main"
fairal-analyze = "baalexp.analyze_results:main"
fairal-check-data = "baalexp.check_data:main"
fairal-validate = "baalexp.validate_results:main"
fairal-collect-summary = "baalexp.collect_summary:main"
fairal-make-paper-artifacts = "baalexp.make_paper_artifacts:main"
fairal-compare-history = "baalexp.compare_history:main"
fairal-paper-artifacts = "baalexp.paper_figures_tables:main"
fairal-convert-qbias = "baalexp.qbias_scale_results:main"
fairal-enhanced-artifacts = "baalexp.enhanced_artifacts:main"
fairal-calibration-diagnostics = "baalexp.calibration_diagnostics:main"

# Compatibility aliases for historical BAAL scripts/results.
baal-run = "baalexp.run_experiment:main"
baal-analyze = "baalexp.analyze_results:main"
baal-check-data = "baalexp.check_data:main"
baal-validate = "baalexp.validate_results:main"
baal-collect-summary = "baalexp.collect_summary:main"
baal-make-paper-artifacts = "baalexp.make_paper_artifacts:main"
baal-compare-history = "baalexp.compare_history:main"
baal-paper-artifacts = "baalexp.paper_figures_tables:main"
baal-convert-qbias = "baalexp.qbias_scale_results:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baalexp"]

[tool.ruff]
line-length = 100

[tool.uv]
package = true

